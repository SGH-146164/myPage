<!DOCTYPE html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Webpage</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">

            <li>반응형 레이아웃 구성</li>
            <li>로그인/회원가입 흐름 구현</li>
            <li>글라스 스타일 UI 적용</li>
          </ul>
        </section>
      </main>
